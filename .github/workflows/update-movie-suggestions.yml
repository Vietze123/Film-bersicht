name: Neue Filmvorschläge aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * 1'

permissions:
  contents: write

concurrency:
  group: update-movie-suggestions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Dateien vorab prüfen
        run: python scripts/update_suggestions.py --validate-only

      - name: Neue Vorschläge über TMDB suchen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_suggestions.py

      - name: Änderung committen
        shell: bash
        run: |
          if git diff --quiet -- suggestions.json; then
            echo "Keine Änderung an suggestions.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suggestions.json
          git commit -m "Filmvorschläge automatisch aktualisieren"
          git push
